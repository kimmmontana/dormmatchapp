{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }} <!-- renders form fields automatically -->
        <input type="submit" value="Login">
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}" class="switch-link">Sign Up here</a></p>
    <p><a href="#" class="forgot-password">Forgot Password?</a></p>
</div>
{% endblock %}
