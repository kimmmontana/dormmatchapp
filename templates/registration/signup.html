{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }} <!-- renders form fields automatically -->
        <input type="submit" value="Sign Up">
    </form>
    <p>Already have an account? <a href="{% url 'login' %}" class="switch-link">Login here</a></p>
</div>
{% endblock %}
