{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dorm Match{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
</head>
<body class=" d-flex flex-column min-vh-100">
    <header class="py-3" style="background-color: white; color: #152238; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="{% url 'home' %}" class="d-flex align-items-center text-dark text-decoration-none">
                    <img src="{% static 'images/logo.png' %}" alt="DormMatch Logo" width="70px" class="me-2">
                    <!-- <span class="fs-4 fw-bold">DormMatch</span> -->
                </a>

                <nav class="nav">
                    <a href="{% url 'home' %}" class="nav-link px-3 {% if request.path == '/' %}text-dark fw-bold{% else %}text-secondary{% endif %}" style="color: inherit;">Home</a>
                    <a href="{% url 'waitlist' %}" class="nav-link px-3 {% if request.path == '/waitlist/' %}text-dark fw-bold{% else %}text-secondary{% endif %}" style="color: inherit;">Waitlist</a>
                    <a href="{% url 'solodorm' %}" class="nav-link px-3 {% if request.path == '/solodorm/' %}text-dark fw-bold{% else %}text-secondary{% endif %}" style="color: inherit;">Solo</a>
                    <a href="{% url 'aboutus' %}" class="nav-link px-3 {% if request.path == '/aboutus/' %}text-dark fw-bold{% else %}text-secondary{% endif %}" style="color: inherit;">About Us</a>
                </nav>

                <div class="text-end">
                    {% if user.is_authenticated %}
                        <div class="dropdown">
                            <a href="#" class="d-block text-dark text-decoration-none dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="fw-bold">{{ user.username }}</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow">
                                <li><a class="dropdown-item" href="{% url 'booking-status' %}">My Bookings1</a></li>
                                <li>
                                    <form method="post" action="{% url 'logout' %}">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item">Log Out</button>
                                   </form>
                                </li>
                            </ul>
                        </div>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-dark me-2">Log In</a>
                        <a href="{% url 'signup' %}" class="btn btn-dark" style="background-color: #152238; color: white;">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

   

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>


</html>
